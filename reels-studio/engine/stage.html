<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Anton'; src: url('node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 800; src: url('node_modules/@fontsource/inter-tight/files/inter-tight-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 600; src: url('node_modules/@fontsource/inter-tight/files/inter-tight-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }
html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
#root { position: absolute; inset: 0; }
.layer { position: absolute; inset: 0; }
.block { position: absolute; left: 80px; right: 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.line { display: flex; flex-wrap: nowrap; justify-content: center; align-items: baseline; white-space: nowrap; }
.w { display: inline-block; position: relative; will-change: transform, opacity; }
.hl { position: absolute; left: -0.08em; right: -0.08em; top: 0.06em; bottom: 0.02em; z-index: -1; transform-origin: left center; }
.foot { position: absolute; left: 80px; right: 170px; font-family: 'JetBrains Mono'; font-weight: 500; font-size: 24px; letter-spacing: 0.01em; line-height: 1.4; text-align: left; }
.aitag { position: absolute; left: 0; right: 0; top: 332px; text-align: center; font-family: 'JetBrains Mono'; font-weight: 500; font-size: 19px; letter-spacing: 0.24em; }
.tag { position: absolute; left: 0; right: 0; top: 286px; text-align: center; font-family: 'JetBrains Mono'; font-weight: 500; font-size: 30px; letter-spacing: 0.22em; }
.num { font-family: 'Anton'; line-height: 0.95; font-variant-numeric: tabular-nums; }
.label { font-family: 'JetBrains Mono'; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root"></div>
<script src="icons.js"></script>
<script src="mapdots.js"></script>
<script>
let TL = null;
const root = document.getElementById('root');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = {
  out: x => 1 - Math.pow(1 - x, 3),
  outExpo: x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
};
const prog = (t, t0, d) => clamp((t - t0) / d, 0, 1);
const fmt = n => Math.round(n).toLocaleString('en-US');

function fontFor(kind) {
  if (kind === 'anton') return { family: 'Anton', weight: 400, upper: true, lh: 1.02 };
  if (kind === 'serif') return { family: 'Instrument Serif', weight: 400, style: 'italic', upper: false, lh: 1.05 };
  return { family: 'Inter Tight', weight: 800, upper: false, lh: 1.08 };
}

// Measure and auto fit each scene's lines into the box.
function fitScene(sc) {
  const f = fontFor(sc.font || 'inter');
  const maxW = sc.maxW || 900, maxH = sc.maxH || 620;
  const m = document.createElement('div');
  m.style.cssText = 'position:absolute;visibility:hidden;left:0;top:0;';
  document.body.appendChild(m);
  let size = sc.size || 150;
  for (; size > 30; size -= 2) {
    m.innerHTML = '';
    m.style.fontFamily = f.family; m.style.fontWeight = f.weight; m.style.fontStyle = f.style || 'normal';
    m.style.fontSize = size + 'px'; m.style.lineHeight = f.lh;
    let w = 0;
    for (const ln of sc.lines) {
      const d = document.createElement('div'); d.style.whiteSpace = 'nowrap'; d.style.display = 'inline-block';
      d.textContent = ln.map(x => (f.upper ? x.w.toUpperCase() : x.w)).join(' ');
      m.appendChild(d); w = Math.max(w, d.getBoundingClientRect().width); m.appendChild(document.createElement('br'));
    }
    const h = sc.lines.length * size * f.lh;
    if (w <= maxW && h <= maxH) break;
  }
  m.remove();
  sc._size = size; sc._font = f;
}

window.init = function (tl) {
  TL = tl;
  for (const sc of TL.scenes) {
    if (sc.layout === 'quote' && !sc.font) { sc.font = 'serif'; sc.size = sc.size || 120; sc.maxH = sc.maxH || 560; }
    if (sc.lines && sc.lines.length) fitScene(sc);
  }
  return true;
};

function bgLayer(sc, t, th) {
  const L = document.createElement('div'); L.className = 'layer';
  if (sc.bg === 'black') L.style.background = th.bg;
  else if (sc.bg === 'dim') L.style.background = 'linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.25) 35%, rgba(0,0,0,0.30) 62%, rgba(0,0,0,0.78) 100%)';
  else if (sc.bg === 'grad') L.style.background = 'radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.15), rgba(0,0,0,0.75))';
  // duotone footage (graded in compose): keep the card readable with a soft dark centre band and darker edges
  else if (sc.bg === 'scrim') {
    const cy = sc.scrimY || ({ words: sc.centerY || 820, quote: sc.centerY || 820, number: 760, list: 900, bars: 1080, versus: (sc.vsTop || 760) + 150, countdown: 820, waffle: 980, map: 1050 }[sc.layout || 'words']) || 820;
    L.style.background = `radial-gradient(ellipse 80% 17% at 50% ${cy}px, rgba(8,8,11,0.58) 0%, rgba(8,8,11,0.30) 55%, rgba(8,8,11,0) 100%),` +
      'linear-gradient(180deg, rgba(8,8,11,0.42) 0%, rgba(8,8,11,0.0) 22%, rgba(8,8,11,0.0) 72%, rgba(8,8,11,0.50) 100%)';
  }
  else if (sc.bg === 'duo') L.style.background = 'linear-gradient(180deg, rgba(8,8,11,0.62) 0%, rgba(8,8,11,0.28) 24%, rgba(8,8,11,0.36) 55%, rgba(8,8,11,0.80) 100%)';
  return L;
}

const shadowed = sc => sc.bg === 'dim' || sc.bg === 'duo' || sc.bg === 'scrim';

// Lucide icon (ISC) that draws itself on: p = 0..1 stroke progress
function iconEl(name, size, color, p, topPx) {
  const inner = (window.ICONS || {})[name];
  if (!inner) return null;
  const d = document.createElement('div');
  d.style.cssText = `position:absolute;left:50%;top:${topPx}px;width:${size}px;height:${size}px;margin-left:${-size / 2}px;opacity:${clamp(p * 3, 0, 1)};filter:drop-shadow(0 4px 18px rgba(0,0,0,0.6))`;
  d.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="overflow:visible;stroke-dasharray:1 1;stroke-dashoffset:${(1 - p).toFixed(4)}">${inner}</svg>`;
  return d;
}

// Live countdown clock: sc.remaining = seconds left at scene start; ticks in real time
function countdownBlock(sc, t, th) {
  const B = document.createElement('div'); B.className = 'block';
  B.style.top = (sc.clockTop || 780) + 'px';
  const rem = Math.max(0, sc.remaining - Math.max(0, t - sc.start));
  const vals = [Math.floor(rem / 86400), Math.floor((rem % 86400) / 3600), Math.floor((rem % 3600) / 60), Math.floor(rem % 60)];
  const labs = sc.labels || ['DAYS', 'HRS', 'MIN', 'SEC'];
  const tick = ease.out(clamp((Math.ceil(rem) - rem) / 0.22, 0, 1));
  const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:18px;justify-content:center;';
  vals.forEach((v, i) => {
    const p = ease.outBack(prog(t, sc.start + 0.05 + i * 0.07, 0.32));
    const cell = document.createElement('div');
    cell.style.cssText = `width:${sc.cellW || 210}px;padding:28px 0 22px;border-radius:24px;background:rgba(8,8,11,0.62);` +
      `border:2px solid ${i === 0 ? th.accent : 'rgba(245,242,234,0.24)'};opacity:${clamp(p * 1.4, 0, 1)};transform:translateY(${(1 - p) * 44}px)`;
    const n = document.createElement('div'); n.className = 'num';
    n.style.cssText += `font-size:${sc.numSize || 150}px;color:${i === 0 ? th.accent : th.fg};height:1.0em;line-height:1.0em;overflow:hidden;`;
    const inner = document.createElement('div');
    inner.textContent = String(v).padStart(2, '0');
    if (i === 3 && rem > 0) { inner.style.transform = `translateY(${(1 - tick) * -0.55}em)`; inner.style.opacity = 0.25 + 0.75 * tick; }
    n.appendChild(inner);
    const l = document.createElement('div'); l.className = 'label';
    l.style.cssText += `font-size:24px;color:${th.fg};opacity:0.78;margin-top:14px`; l.textContent = labs[i];
    cell.appendChild(n); cell.appendChild(l); row.appendChild(cell);
  });
  B.appendChild(row);
  if (sc.caption) {
    const C = document.createElement('div'); C.className = 'label';
    C.style.cssText += `font-size:28px;color:${th.fg};opacity:${0.8 * prog(t, sc.start + 0.4, 0.3)};margin-top:34px`;
    C.textContent = sc.caption; B.appendChild(C);
  }
  return B;
}

// Waffle grid: cols x rows cells, the first sc.filled light up from sc.t0 over sc.fill_dur
function waffleBlock(sc, t, th) {
  const cols = sc.cols || 10, rows = sc.rows || 10, n = cols * rows;
  const cell = sc.cell || 58, gap = sc.gap || 12, fd = sc.fill_dur || 1.2, top = sc.waffleTop || 820;
  const W = cols * cell + (cols - 1) * gap, H = rows * cell + (rows - 1) * gap;
  const F = document.createElement('div'); F.className = 'layer';
  const G = document.createElement('div');
  G.style.cssText = `position:absolute;left:${(1080 - W) / 2}px;top:${top}px;width:${W}px;display:grid;grid-template-columns:repeat(${cols},${cell}px);gap:${gap}px;`;
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    const a = prog(t, sc.start + 0.08 + i * 0.005, 0.2);
    const on = i < sc.filled ? prog(t, sc.t0 + (i / Math.max(1, sc.filled)) * fd, 0.2) : 0;
    const s = on > 0 ? 0.72 + 0.28 * ease.outBack(on) : 1;
    c.style.cssText = `width:${cell}px;height:${cell}px;border-radius:${Math.round(cell * 0.22)}px;opacity:${a};` +
      `background:${on > 0 ? th.accent : 'rgba(245,242,234,0.17)'};transform:scale(${s})`;
    G.appendChild(c);
  }
  F.appendChild(G);
  if (sc.caption) {
    const C = document.createElement('div'); C.className = 'label';
    C.style.cssText += `position:absolute;left:80px;right:80px;text-align:center;top:${top + H + 40}px;font-size:30px;color:${th.fg};opacity:${prog(t, sc.t0 + fd, 0.3)}`;
    C.textContent = sc.caption; F.appendChild(C);
  }
  return F;
}

// Side by side comparison card: sc.topic, sc.left / sc.right = {label, value, sub, t}; the right side is the hero (accent)
function fitText(txt, family, weight, maxW, start) {
  const m = document.createElement('span');
  m.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font-family:${family};font-weight:${weight}`;
  document.body.appendChild(m); m.textContent = txt;
  let s = start;
  for (; s > 40; s -= 4) { m.style.fontSize = s + 'px'; if (m.getBoundingClientRect().width <= maxW) break; }
  m.remove(); return s;
}
function versusBlock(sc, t, th) {
  const F = document.createElement('div'); F.className = 'layer';
  const top = sc.vsTop || 760, colW = 430;
  if (sc.topic) {
    const T = document.createElement('div'); T.className = 'label';
    T.style.cssText += `position:absolute;left:0;right:0;text-align:center;top:${top - 96}px;font-size:32px;color:${th.fg};opacity:${0.9 * prog(t, sc.start, 0.3)};text-shadow:0 3px 14px rgba(0,0,0,0.8)`;
    T.textContent = sc.topic; F.appendChild(T);
  }
  const div = document.createElement('div');
  const dp = ease.out(prog(t, sc.start + 0.05, 0.4));
  div.style.cssText = `position:absolute;left:539px;width:2px;top:${top}px;height:${330 * dp}px;background:rgba(245,242,234,0.35)`;
  F.appendChild(div);
  const vs = document.createElement('div'); vs.className = 'label';
  vs.style.cssText += `position:absolute;left:${540 - 38}px;top:${top + 130}px;width:76px;height:76px;border-radius:50%;background:${th.bg};border:2px solid rgba(245,242,234,0.35);` +
    `display:flex;align-items:center;justify-content:center;font-size:24px;color:${th.fg};opacity:${dp}`;
  vs.textContent = 'VS'; F.appendChild(vs);
  [['left', 270, false], ['right', 810, true]].forEach(([k, cx, hero]) => {
    const s = sc[k]; if (!s) return;
    const p = prog(t, s.t != null ? s.t : sc.start + (hero ? 0.6 : 0.2), 0.3);
    if (p <= 0) return;
    const e = ease.outBack(p);
    const C = document.createElement('div');
    C.style.cssText = `position:absolute;left:${cx - colW / 2}px;width:${colW}px;top:${top}px;text-align:center;opacity:${clamp(p * 1.5, 0, 1)};` +
      `transform:translateY(${(1 - e) * 36}px) scale(${0.92 + 0.08 * e});text-shadow:0 4px 22px rgba(0,0,0,0.8)`;
    const lab = document.createElement('div'); lab.className = 'label';
    lab.style.cssText += `font-size:28px;color:${hero ? th.accent : th.fg};opacity:${hero ? 1 : 0.75}`;
    lab.textContent = s.label;
    const val = document.createElement('div'); val.className = 'num';
    const size = fitText(String(s.value), 'Anton', 400, colW - 30, s.size || 170);
    val.style.cssText += `font-size:${size}px;color:${hero ? th.accent : th.fg};opacity:${hero ? 1 : 0.82};margin-top:22px;line-height:1.0;white-space:nowrap`;
    val.textContent = s.value;
    C.appendChild(lab); C.appendChild(val);
    if (s.sub) {
      const sub = document.createElement('div');
      sub.style.cssText = `font-family:'Inter Tight';font-weight:600;font-size:32px;line-height:1.2;color:${th.fg};opacity:0.78;margin-top:18px`;
      sub.textContent = s.sub; C.appendChild(sub);
    }
    F.appendChild(C);
  });
  return F;
}

// Dot matrix world map (Natural Earth land, equirectangular) with city pins and an optional westward midnight sweep
function mapBlock(sc, t, th) {
  const M = window.MAPDOTS;
  const lonMin = sc.lonMin != null ? sc.lonMin : -130, lonMax = sc.lonMax != null ? sc.lonMax : 180;
  const c0 = Math.max(0, Math.floor((lonMin - M.lon0) / M.step)), c1 = Math.min(M.cols, Math.ceil((lonMax - M.lon0) / M.step));
  const W = sc.mapW || 1040, cell = W / (c1 - c0), H = cell * M.rows;
  const left = (1080 - W) / 2, top = sc.mapTop || 900;
  const lonL = M.lon0 + c0 * M.step;
  const xOf = lon => left + ((lon - lonL) / M.step) * cell, yOf = lat => top + ((M.lat0 - lat) / M.step) * cell;
  const F = document.createElement('div'); F.className = 'layer';
  const cv = document.createElement('canvas'); cv.width = Math.ceil(W); cv.height = Math.ceil(H);
  cv.style.cssText = `position:absolute;left:${left}px;top:${top}px;`;
  const g = cv.getContext('2d');
  const appear = prog(t, sc.start, 0.6);
  const band = sc.sweep ? sc.sweep.from + (sc.sweep.to - sc.sweep.from) * ease.inOut(prog(t, sc.sweep.t, sc.sweep.dur || 2.0)) : null;
  for (const [c, r] of M.dots) {
    if (c < c0 || c >= c1) continue;
    const x = (c - c0 + 0.5) * cell, y = (r + 0.5) * cell;
    const rv = clamp(appear * 1.6 - (x / W) * 0.6, 0, 1);
    if (rv <= 0) continue;
    const lit = band != null && M.lon0 + (c + 0.5) * M.step >= band;
    g.globalAlpha = (lit ? 0.92 : 0.30) * rv;
    g.fillStyle = lit ? th.accent : th.fg;
    g.beginPath(); g.arc(x, y, cell * 0.31, 0, Math.PI * 2); g.fill();
  }
  F.appendChild(cv);
  if (band != null && band > lonMin && band < lonMax && t >= sc.sweep.t) {
    const bx = xOf(band);
    const L = document.createElement('div');
    L.style.cssText = `position:absolute;left:${bx - 1.5}px;top:${top - 30}px;width:3px;height:${H + 60}px;background:${th.accent};box-shadow:0 0 24px ${th.accent}`;
    F.appendChild(L);
    const T = document.createElement('div'); T.className = 'label';
    T.style.cssText += `position:absolute;left:${bx - 150}px;width:300px;text-align:center;top:${top - 76}px;font-size:24px;color:${th.accent}`;
    T.textContent = sc.sweep.label || 'MIDNIGHT';
    F.appendChild(T);
  }
  for (const cy of sc.cities || []) {
    const p = prog(t, cy.t, 0.35);
    if (p <= 0) continue;
    const x = xOf(cy.lon), y = yOf(cy.lat), col = cy.accent === false ? th.fg : th.accent;
    const pr = ((t - cy.t) % 1.6) / 1.6;
    const ring = document.createElement('div');
    ring.style.cssText = `position:absolute;left:${x - 34}px;top:${y - 34}px;width:68px;height:68px;border-radius:50%;border:3px solid ${col};opacity:${(1 - pr) * 0.85};transform:scale(${0.25 + pr})`;
    const dot = document.createElement('div');
    const e = ease.outBack(p);
    dot.style.cssText = `position:absolute;left:${x - 10}px;top:${y - 10}px;width:20px;height:20px;border-radius:50%;background:${col};border:3px solid ${th.fg};transform:scale(${e})`;
    F.appendChild(ring); F.appendChild(dot);
    const lab = document.createElement('div');
    const side = cy.side || 'r', dx = cy.dx || 0, dy = cy.dy || 0;
    lab.style.cssText = `position:absolute;top:${y - 58 + dy}px;${side === 'r' ? `left:${x + 26 + dx}px` : `right:${1080 - x + 26 - dx}px`};` +
      `text-align:${side === 'r' ? 'left' : 'right'};opacity:${clamp(p * 1.5, 0, 1)};transform:translateY(${(1 - e) * 16}px);text-shadow:0 3px 14px rgba(0,0,0,0.85);white-space:nowrap`;
    lab.innerHTML = `<div class="label" style="font-size:24px;color:${th.fg}">${cy.name}</div>` +
      (cy.time ? `<div class="num" style="font-size:52px;color:${col};margin-top:4px">${cy.time}</div>` : '');
    F.appendChild(lab);
  }
  return F;
}

function wordsBlock(sc, t, th, topPx) {
  const f = sc._font, size = sc._size;
  const B = document.createElement('div'); B.className = 'block';
  B.style.top = topPx + 'px';
  B.style.fontFamily = f.family; B.style.fontWeight = f.weight; B.style.fontStyle = f.style || 'normal';
  B.style.fontSize = size + 'px'; B.style.lineHeight = f.lh; B.style.color = th.fg;
  if (shadowed(sc)) B.style.textShadow = '0 4px 22px rgba(0,0,0,0.75), 0 1px 3px rgba(0,0,0,0.6)';
  for (const ln of sc.lines) {
    const L = document.createElement('div'); L.className = 'line';
    ln.forEach((x, i) => {
      const s = document.createElement('span'); s.className = 'w';
      const txt = f.upper ? x.w.toUpperCase() : x.w;
      const p = prog(t, x.t, 0.16);
      if (p <= 0) { s.style.opacity = 0; }
      else {
        const e = ease.outBack(p);
        s.style.opacity = clamp(p * 1.6, 0, 1);
        s.style.transform = `translateY(${(1 - e) * 0.28 * size}px) scale(${1 + (1 - e) * 0.10})`;
      }
      if (x.accent === 'box') {
        const hl = document.createElement('span'); hl.className = 'hl'; hl.style.background = th.accent;
        const ph = ease.out(prog(t, x.t + 0.04, 0.22));
        hl.style.transform = `scaleX(${ph})`;
        s.appendChild(hl);
        s.style.color = ph > 0.45 ? th.ink : th.fg;
      } else if (x.accent === 'color') {
        s.style.color = th.accent;
      } else if (x.accent === 'serif') {
        s.style.fontFamily = 'Instrument Serif'; s.style.fontStyle = 'italic'; s.style.fontWeight = 400;
        s.style.color = th.accent; s.style.fontSize = '1.12em';
      } else if (x.accent === 'teal') {
        s.style.color = th.accent2;
      }
      s.appendChild(document.createTextNode(txt));
      L.appendChild(s);
      if (i < ln.length - 1) L.appendChild(document.createTextNode(' '));
    });
    B.appendChild(L);
  }
  return B;
}

function numberBlock(sc, t, th) {
  const B = document.createElement('div'); B.className = 'block';
  B.style.top = (sc.numTop || 700) + 'px';
  const p = ease.outExpo(prog(t, sc.t0, Math.max(0.2, sc.t1 - sc.t0)));
  const val = sc.from + (sc.to - sc.from) * p;
  const N = document.createElement('div'); N.className = 'num';
  N.style.fontSize = (sc.numSize || 300) + 'px'; N.style.color = th.accent;
  // visible (dimmed, at the start value) from the first frame of the scene, full strength once counting starts
  N.style.opacity = Math.max(0.28 * clamp(prog(t, sc.start, 0.12), 0, 1), clamp(prog(t, sc.t0 - 0.05, 0.15) * 1.5, 0, 1));
  N.textContent = (sc.prefix || '') + (sc.decimals ? val.toFixed(sc.decimals) : fmt(val)) + (sc.suffix || '');
  B.appendChild(N);
  if (sc.label) {
    const Lb = document.createElement('div'); Lb.className = 'label';
    Lb.style.fontSize = '30px'; Lb.style.color = th.fg; Lb.style.marginTop = '26px';
    Lb.style.opacity = clamp(prog(t, sc.t0 + 0.25, 0.3), 0, 1);
    Lb.textContent = sc.label;
    B.appendChild(Lb);
  }
  return B;
}

function barsBlock(sc, t, th) {
  // Horizontal timeline bars: [{label, value, accent}]
  const B = document.createElement('div'); B.className = 'block';
  B.style.top = (sc.barsTop || 1060) + 'px'; B.style.alignItems = 'stretch';
  const max = Math.max(...sc.bars.map(b => b.value));
  sc.bars.forEach((b, i) => {
    const row = document.createElement('div'); row.style.cssText = 'display:flex;align-items:center;gap:24px;margin:20px 0;';
    const lab = document.createElement('div'); lab.className = 'label'; lab.style.cssText += 'font-size:32px;width:300px;text-align:right;';
    lab.style.color = th.fg; lab.textContent = b.label;
    const track = document.createElement('div'); track.style.cssText = 'flex:1;height:60px;position:relative;';
    const bar = document.createElement('div');
    const p = ease.out(prog(t, (b.t != null ? b.t : sc.t0 + i * 0.25), 0.6));
    const pct = (b.value / max) * 62 * p;
    bar.style.cssText = `position:absolute;left:0;top:0;bottom:0;width:${pct}%;background:${b.accent ? th.accent : th.fg};opacity:${b.accent ? 1 : 0.85}`;
    const val = document.createElement('div'); val.className = 'label';
    val.style.cssText = `position:absolute;top:50%;transform:translateY(-50%);left:calc(${pct}% + 14px);font-size:${b.accent ? 38 : 32}px;white-space:nowrap;color:${b.accent ? th.accent : th.fg};opacity:${p}`;
    val.textContent = b.text || fmt(b.value);
    track.appendChild(bar); track.appendChild(val);
    row.appendChild(lab); row.appendChild(track); B.appendChild(row);
  });
  return B;
}

function listBlock(sc, t, th) {
  // Stacked items (e.g. release dates); each appears at item.t and can be struck through at item.ts.
  const B = document.createElement('div'); B.className = 'block';
  B.style.top = (sc.listTop || 760) + 'px';
  for (const it of sc.items) {
    const row = document.createElement('div');
    const p = prog(t, it.t, 0.18);
    const e = ease.outBack(p);
    row.style.cssText = `position:relative;display:inline-block;margin:14px 0;font-family:Anton;font-size:${it.size || 128}px;line-height:1.0;letter-spacing:0.01em;opacity:${clamp(p * 1.6, 0, 1)};transform:translateY(${(1 - e) * 40}px)`;
    const struck = it.ts != null && t >= it.ts;
    row.style.color = it.final ? th.accent : (struck ? 'rgba(245,242,234,0.42)' : th.fg);
    row.textContent = it.text;
    if (it.ts != null) {
      const s = document.createElement('div');
      const sp = ease.out(prog(t, it.ts, 0.22));
      s.style.cssText = `position:absolute;left:-14px;top:52%;height:12px;background:${th.accent};width:calc((100% + 28px) * ${sp})`;
      row.appendChild(s);
    }
    B.appendChild(row);
  }
  return B;
}

function endCard(sc, t, th) {
  const L = document.createElement('div'); L.className = 'layer'; L.style.background = sc.overFootage ? 'rgba(8,8,11,0.62)' : th.bg;
  const p = prog(t, sc.start, 0.5);
  const B = document.createElement('div'); B.className = 'block'; B.style.top = '700px';
  const brand = document.createElement('div');
  brand.style.cssText = `font-family:Anton;font-size:132px;letter-spacing:${0.06 + (1 - ease.out(p)) * 0.2}em;color:${th.fg};opacity:${p}`;
  brand.textContent = sc.brand;
  const rule = document.createElement('div');
  rule.style.cssText = `height:6px;background:${th.accent};margin:34px auto 30px;width:${ease.out(prog(t, sc.start + 0.2, 0.5)) * 420}px`;
  const series = document.createElement('div'); series.className = 'label';
  series.style.cssText += `font-size:30px;color:${th.accent};opacity:${prog(t, sc.start + 0.35, 0.4)}`;
  series.textContent = sc.series;
  const ep = document.createElement('div');
  ep.style.cssText = `font-family:'Inter Tight';font-weight:800;font-size:56px;color:${th.fg};margin-top:22px;opacity:${prog(t, sc.start + 0.5, 0.4)}`;
  ep.textContent = sc.episode;
  const cta = document.createElement('div'); cta.className = 'label';
  cta.style.cssText += `font-size:26px;color:${th.fg};margin-top:60px;padding:16px 30px;border:2px solid ${th.fg};border-radius:999px;opacity:${prog(t, sc.start + 0.8, 0.4)}`;
  cta.textContent = sc.cta;
  B.appendChild(brand); B.appendChild(rule); B.appendChild(series); B.appendChild(ep); B.appendChild(cta);
  L.appendChild(B);
  return L;
}

window.renderAt = function (t) {
  const th = TL.theme;
  root.innerHTML = '';
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  if (sc.layout === 'endcard') { root.appendChild(endCard(sc, t, th)); return; }
  root.appendChild(bgLayer(sc, t, th));
  if (sc.layout === 'number') {
    root.appendChild(numberBlock(sc, t, th));
    if (sc.lines && sc.lines.length) root.appendChild(wordsBlock(sc, t, th, sc.wordsTop || 520));
  } else if (sc.layout === 'list') {
    if (sc.lines && sc.lines.length) root.appendChild(wordsBlock(sc, t, th, sc.wordsTop || 470));
    root.appendChild(listBlock(sc, t, th));
  } else if (sc.layout === 'bars') {
    if (sc.lines && sc.lines.length) root.appendChild(wordsBlock(sc, t, th, sc.wordsTop || 560));
    root.appendChild(barsBlock(sc, t, th));
  } else if (sc.layout === 'countdown') {
    if (sc.lines && sc.lines.length) root.appendChild(wordsBlock(sc, t, th, sc.wordsTop || 500));
    root.appendChild(countdownBlock(sc, t, th));
  } else if (sc.layout === 'waffle') {
    if (sc.lines && sc.lines.length) root.appendChild(wordsBlock(sc, t, th, sc.wordsTop || 470));
    root.appendChild(waffleBlock(sc, t, th));
  } else if (sc.layout === 'map') {
    if (sc.lines && sc.lines.length) root.appendChild(wordsBlock(sc, t, th, sc.wordsTop || 470));
    root.appendChild(mapBlock(sc, t, th));
  } else if (sc.layout === 'versus') {
    if (sc.lines && sc.lines.length) root.appendChild(wordsBlock(sc, t, th, sc.wordsTop || 470));
    root.appendChild(versusBlock(sc, t, th));
  } else if (sc.lines && sc.lines.length) {
    const h = sc.lines.length * sc._size * sc._font.lh;
    const center = sc.centerY || 820;
    const top = Math.round(center - h / 2);
    if (sc.layout === 'quote') {
      const Q = document.createElement('div');
      Q.style.cssText = `position:absolute;left:0;right:0;text-align:center;top:${top - 250}px;font-family:'Instrument Serif';font-style:italic;font-size:300px;line-height:1;color:${th.accent};opacity:${0.9 * prog(t, sc.start, 0.3)};transform:translateY(${(1 - ease.out(prog(t, sc.start, 0.4))) * 30}px)`;
      Q.textContent = '“';
      root.appendChild(Q);
    } else if (sc.icon) {
      const size = sc.iconSize || 132;
      const I = iconEl(sc.icon, size, sc.iconColor === 'fg' ? th.fg : th.accent, ease.out(prog(t, sc.start + 0.02, 0.6)), top - size - 44);
      if (I) root.appendChild(I);
    }
    root.appendChild(wordsBlock(sc, t, th, top));
    if (sc.attrib) {
      const A = document.createElement('div'); A.className = 'label';
      const last = sc.lines[sc.lines.length - 1];
      const ta = last.length ? last[last.length - 1].t + 0.25 : sc.start + 0.6;
      A.style.cssText += `position:absolute;left:80px;right:80px;text-align:center;top:${top + h + 50}px;font-size:28px;color:${th.fg};opacity:${0.85 * prog(t, ta, 0.35)};text-shadow:0 3px 14px rgba(0,0,0,0.8)`;
      A.textContent = sc.attrib;
      root.appendChild(A);
    }
  }
  if (sc.footnote) {
    const F = document.createElement('div'); F.className = 'foot';
    F.style.top = (sc.footTop || 1236) + 'px'; F.style.color = th.fg; F.style.opacity = 0.62 * prog(t, sc.start + 0.25, 0.3);
    F.textContent = sc.footnote;
    root.appendChild(F);
  }
  if (TL.tag && !sc.noTag) {
    const G = document.createElement('div'); G.className = 'tag'; G.style.color = th.fg; G.style.opacity = 0.9;
    const dot = `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${th.accent};margin-right:16px;vertical-align:middle;opacity:${0.55 + 0.45 * Math.abs(Math.sin(t * 3))}"></span>`;
    G.innerHTML = dot + TL.tag;
    root.appendChild(G);
  }
  if (sc.credit) {
    const C = document.createElement('div'); C.className = 'aitag'; C.style.color = th.fg; C.style.opacity = 0.6;
    C.textContent = sc.credit;
    root.appendChild(C);
  }
  if (sc.ai) {
    const A = document.createElement('div'); A.className = 'aitag'; A.style.color = th.fg; A.style.opacity = 0.55;
    A.textContent = 'AI VISUAL';
    root.appendChild(A);
  }
  // quick flash on cuts marked 'flash'
  if (sc.flash) {
    const fp = prog(t, sc.start, 0.12);
    if (fp < 1) { const W = document.createElement('div'); W.className = 'layer'; W.style.background = '#fff'; W.style.opacity = 0.35 * (1 - fp); root.appendChild(W); }
  }
};
</script>
