<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Anton'; src: url('node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Inter Tight'; font-weight: 800; src: url('node_modules/@fontsource/inter-tight/files/inter-tight-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #08080B; }
#bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
#shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,8,11,0.55) 0%, rgba(8,8,11,0.35) 30%, rgba(8,8,11,0.55) 58%, rgba(8,8,11,0.92) 100%); }
.tag { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: 'JetBrains Mono'; font-weight: 500; font-size: 32px; letter-spacing: 0.22em; color: #F5F2EA; }
.dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: #FF7A1A; margin-right: 16px; vertical-align: middle; }
.title { position: absolute; left: 70px; right: 70px; top: 470px; text-align: center; font-family: 'Anton'; text-transform: uppercase; color: #F5F2EA; line-height: 1.02; }
.title .ln { white-space: nowrap; line-height: 1.12; }
.box { display: inline-block; background: #FF7A1A; color: #0B0B0F; padding: 0.04em 0.12em 0 0.12em; margin: 0.08em 0 0.06em 0; line-height: 1.0; }
.num { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Anton'; color: #FF7A1A; line-height: 1; }
.label { position: absolute; left: 0; right: 0; text-align: center; font-family: 'JetBrains Mono'; font-weight: 500; font-size: 30px; letter-spacing: 0.18em; color: #F5F2EA; text-transform: uppercase; }
.brand { position: absolute; left: 0; right: 0; top: 1560px; text-align: center; font-family: 'Anton'; font-size: 44px; letter-spacing: 0.16em; color: #F5F2EA; opacity: 0.9; }
</style>
</head>
<body>
<div id="bg"></div><div id="shade"></div>
<div class="tag" id="tag"></div>
<div class="title" id="title"></div>
<div class="num" id="num"></div>
<div class="label" id="label"></div>
<div class="brand" id="brand"></div>
<script>
window.renderCover = function (c) {
  document.getElementById('bg').style.backgroundImage = c.bg ? `url('${c.bg}')` : 'none';
  document.getElementById('tag').innerHTML = '<span class="dot"></span>' + c.tag;
  const T = document.getElementById('title'); T.style.fontSize = (c.titleSize || 128) + 'px';
  T.innerHTML = c.lines.map(l => '<div class="ln">' + l.replace(/\*(.+?)\*/g, '<span class="box">$1</span>') + '</div>').join('');
  const N = document.getElementById('num'); N.textContent = c.number || ''; N.style.fontSize = (c.numSize || 230) + 'px'; N.style.top = (c.numTop || 1030) + 'px';
  const L = document.getElementById('label'); L.textContent = c.label || ''; L.style.top = ((c.numTop || 1030) + (c.numSize || 230) + 20) + 'px';
  document.getElementById('brand').textContent = c.brand || '';
};
</script>
</body>
</html>
